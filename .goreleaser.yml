version: 2
project_name: notify-qq

builds:
  - id: notify-qq
    main: ./cmd/notify-qq
    binary: notify-qq
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/ceclin/notify-qq/internal/app.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
        -X github.com/ceclin/notify-qq/internal/app.commit={{ .FullCommit }}
        -X github.com/ceclin/notify-qq/internal/app.builtAt={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - .env.example
      - THIRD_PARTY_LICENSES

checksum:
  name_template: SHA256SUMS

changelog:
  use: github-native

release:
  github:
    owner: ceclin
    name: notify-qq
  draft: true
  prerelease: auto
  make_latest: false
  extra_files:
    - glob: dist/digests.txt

dockers_v2:
  - images: [ghcr.io/ceclin/notify-qq]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Tag }}"
    extra_files:
      - LICENSE
      - THIRD_PARTY_LICENSES
    labels:
      org.opencontainers.image.source: https://github.com/ceclin/notify-qq
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Tag }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

docker_digest:
  name_template: digests.txt
