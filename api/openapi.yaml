openapi: 3.1.1
info:
  title: QQ notification service
  version: 1.0.0
  description: |
    Send Markdown notifications with optional link buttons to the private QQ chat bound to the authenticated
    API key. Keys have independent recipients and pairing state. Every response
    includes X-Request-ID for correlation. Request bodies are limited to 64 KiB.
    Requests have a 20-second deadline; each QQ call has a 10-second timeout.
    Notification sends are never replayed automatically. A transport failure or
    timeout can occur after acceptance, so retrying may duplicate a notification.
    When OpenTelemetry export is enabled, notify and status requests accept W3C
    traceparent/tracestate headers for trace correlation. Invalid trace context
    is ignored. Health and readiness probes are excluded from telemetry.
servers:
  - url: /
    description: Default deployment with an empty API_PATH_PREFIX
  - url: '{apiPathPrefix}'
    description: Deployment under a configured API_PATH_PREFIX
    variables:
      apiPathPrefix:
        default: /api/notify-qq
        description: |
          The configured API_PATH_PREFIX, without a trailing slash, such as
          /api/notify-qq. Use the root server when empty. Every HTTP endpoint,
          including healthz, is served exclusively under this prefix. A reverse
          proxy must forward the complete path without stripping the prefix.
security:
  - notificationKey: []
paths:
  /notify:
    post:
      operationId: sendNotification
      summary: Send a Markdown notification to this API key's paired recipient
      description: |
        Content is required Markdown and must contain non-whitespace text. The
        complete body, including any headings supplied by the caller, is trimmed
        and forwarded directly, with a limit of 4000 UTF-8 bytes. QQ receives
        msg_type=2 and markdown.content; there is no plain
        text mode. Up to five optional HTTP(S) link buttons are arranged two per
        row. Button labels and URLs are trimmed; labels allow 1-10 characters
        without control characters and URLs allow at most 2048 UTF-8 bytes,
        without credentials or whitespace. Buttons cannot supply callbacks,
        permissions, or raw QQ fields. Unknown fields and multiple JSON objects
        are rejected. Accepted means QQ returned a message ID; it does not confirm
        a device notification or that the message was read. The recipient is read
        from the authenticated key's SQLite binding; request fields cannot select
        a different recipient. An unbound key returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
            example:
              content: "## Backup completed\n\n**Success**\n\nAll files were uploaded successfully."
              buttons:
                - label: View logs
                  url: https://example.com/logs
      responses:
        '200':
          description: QQ accepted the notification
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedNotification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This API key has no bound recipient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          description: Content-Type is not application/json
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: QQ rate limit reached; wait before retrying
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              required: true
              description: QQ retry guidance, or 60 seconds when QQ provides none
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            QQ rejected the operation, returned an invalid response, or a transport
            failure occurred. Delivery may be uncertain after a transport failure.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: QQ request timed out; delivery is uncertain
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /status:
    get:
      operationId: getPairingStatus
      summary: Read pairing status and recipient OpenID for the authenticated API key
      responses:
        '200':
          description: This key's pairing status and the shared QQ WebSocket state
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [paired, user_openid, websocket_connected]
                properties:
                  websocket_connected:
                    type: boolean
                    description: True after WebSocket READY or RESUMED; false while disconnected
                  paired:
                    type: boolean
                  user_openid:
                    type: string
                    description: Recipient bound only to this key; empty when unpaired; not a numeric QQ account number
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check SQLite and HTTP lifecycle readiness
      description: |
        Public readiness probe with a one-second database deadline. Returns 200
        when HTTP serving has started, shutdown has not begun, and the api_keys
        table can be read. An empty table is healthy. The probe does not contact
        QQ, require pairing, or depend on WebSocket connectivity. It checks read
        availability, not whether future writes or QQ deliveries will succeed.
        Repeated storage failures are logged on readiness transitions.
      security: []
      responses:
        '200':
          description: Local service is ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: Service is starting, stopping, or local SQLite storage is unavailable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /healthz:
    get:
      operationId: getLiveness
      summary: Check process liveness
      description: Does not check QQ connectivity or recipient pairing.
      security: []
      responses:
        '200':
          description: The HTTP service is running
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    notificationKey:
      type: http
      scheme: bearer
      description: |
        Any active API key in DATA_DIR/notify.sqlite3. Create and revoke keys
        through the local keys command; no management HTTP API is exposed.
        Revoked or unknown credentials return 401; a storage lookup failure
        returns 500.
  headers:
    RequestID:
      required: true
      description: Server-generated correlation ID for logs and error responses
      schema:
        $ref: '#/components/schemas/RequestID'
  schemas:
    RequestID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Notification:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: Complete Markdown body, including headings; trimmed content must fit within 4000 UTF-8 bytes
        buttons:
          type: [array, 'null']
          maxItems: 5
          description: Optional link buttons, two per row; null or empty omits the QQ keyboard
          items:
            $ref: '#/components/schemas/LinkButton'
    LinkButton:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          description: Trimmed label of 1-10 Unicode characters without control characters
        url:
          type: string
          minLength: 1
          description: Trimmed absolute HTTP(S) URL without credentials or whitespace, at most 2048 UTF-8 bytes
    AcceptedNotification:
      type: object
      additionalProperties: false
      required: [status, message_id, timestamp]
      properties:
        status:
          type: string
          enum: [accepted]
        message_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          description: Timestamp returned by QQ; empty when QQ omits it
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              description: |
                Machine-readable reason, such as unauthorized, invalid_json,
                content_too_long, buttons_invalid, button_label_invalid, button_url_invalid,
                recipient_not_paired, qq_request_rejected, qq_transport_failed,
                qq_invalid_response, key_lookup_failed, panic_recovered, or request_rejected.
            message:
              type: string
              minLength: 1
              description: Public diagnostic guidance without internal errors or credentials
        request_id:
          $ref: '#/components/schemas/RequestID'
        qq:
          type: object
          additionalProperties: false
          required: [http_status]
          description: Present when QQ returned a rejection; absent for transport or parsing failures
          properties:
            http_status:
              type: integer
            code:
              type: integer
            trace_id:
              type: string
  responses:
    BadRequest:
      description: Malformed JSON, unsupported fields, or invalid notification data
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or revoked Bearer API key
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooLarge:
      description: Request body exceeds 64 KiB
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnexpectedError:
      description: Internal failure (including authentication storage failures) or framework rejection, such as 404 or 405
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
